name: roadtrip_offline_games
description: Offline Bluetooth multiplayer board & card games with Achaemenid theme for road trips.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Multiplayer / networking (Hotspot + WebSocket primary)
  flutter_blue_plus: ^1.32.0
  web_socket_channel: ^3.0.0
  connectivity_plus: ^6.0.0
  network_info_plus: ^5.0.3          # Get local IP for Hotspot host
  qr_flutter: ^4.1.0                 # Show QR code for easy join
  mobile_scanner: ^5.1.1             # Scan QR on guest device

  # UI & utilities
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  intl: any
  uuid: ^4.4.0
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/boards/
    - assets/cards/
    - assets/icons/
    - assets/images/
